
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人介紹</title>

    <style>
        /* 1. 整個網頁的基本設定 */
        body {
            margin: 0;
            font-family: "Noto Sans TC", "微軟正黑體", sans-serif;
            background-color: #F7F4EE;
            color: #51483F;
            line-height: 1.8;
        }

        /* 2. 網頁主要內容區域 */
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
        }

        /* 3. 個人介紹卡片 */
        .profile {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(80, 60, 40, 0.06);
        }

        /* 4. 個人照片 */
        .profile img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        /* 姓名標題 */
        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            margin: 10px 0;
        }

        /* 小標題 */
        h2 {
            font-size: 20px;
            font-weight: normal;
            border-bottom: 1px solid #E5DCCF;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        /* 個人簡介 */
        .intro {
            color: #82766A;
            max-width: 500px;
            margin: 15px auto;
        }

        /* 興趣標籤區域 */
        .hobbies {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        /* 單一興趣標籤 */
        .hobby {
            background-color: #F1E9DE;
            color: #695744;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
        }

        /* 頁尾文字 */
        footer {
            text-align: center;
            margin-top: 25px;
            color: #A49A8F;
            font-size: 13px;
        }

        /* 手機版排版 */
        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 16px;
            }

            .profile {
                padding: 25px 18px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

</body>
</html>
